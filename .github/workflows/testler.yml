# Her gönderimde ve PR'da: biçim denetimi (ruff) ve testler (pytest).
# Canlı Vercel ortamıyla aynı Python sürümü (.python-version: 3.12). Siteye
# paket eklemez: pytest ve ruff yalnız burada kurulur.
name: Testler

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: testler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Araçları kur
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Biçim denetimi
        run: |
          ruff check .
          ruff format --check .
      - name: Testler
        run: python -m pytest -q
